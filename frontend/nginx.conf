server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las evidencias pueden pesar hasta 5 MB; el backend acepta hasta 20 MB
    # por petición (varias fotos). Nginx debe permitir ese tamaño.
    client_max_body_size 25m;
    server_tokens off;

    # Cabeceras comunes para todas las rutas que se proxifican al backend.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # API del backend Spring Boot.
    location /auth/ {
        proxy_pass http://backend:8080;
    }

    location /quejas/ {
        proxy_pass http://backend:8080;
    }

    location /usuarios/ {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # Imágenes guardadas en el volumen compartido por backend y Nginx.
    location ^~ /evidencias/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Fallback de la SPA de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
