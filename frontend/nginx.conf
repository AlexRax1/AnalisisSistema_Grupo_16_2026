server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # Docker Compose DNS. Se usa una variable en proxy_pass para que Nginx
    # vuelva a resolver el backend si el contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8080;

    # Rutas de la API: se envían al backend Spring Boot.
    location ^~ /auth/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /quejas/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /usuarios/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /admin/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    # Evidencias servidas por el backend desde su volumen.
    location ^~ /subidas/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /actuator/ {
        proxy_pass $backend_url;
        include /etc/nginx/proxy_params;
    }

    # Archivos estáticos de Angular.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Fallback de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
