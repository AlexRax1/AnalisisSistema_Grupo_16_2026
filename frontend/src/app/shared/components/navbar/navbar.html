<nav class="app-navbar">
  <div class="navbar-brand">
    <span class="brand-title">Municipalidad de San Juan Sacatepéquez</span>
  </div>

  <div class="navbar-actions">
    <!-- Links de navegación de acuerdo al rol del ciudadano -->
    <div class="nav-links" *ngIf="rolActual === 'CIUDADANO'">
      <a routerLink="/portal-ciudadano" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Mis Quejas</a>
      <a routerLink="/portal-ciudadano/crear" routerLinkActive="active" class="btn-crear">+ Registrar Queja</a>
    </div>

    <!-- Selector de Rol Demo para pruebas -->
    <div class="role-selector-box">
      <label for="role-select">Rol Demo:</label>
      <select id="role-select" [ngModel]="rolActual" (ngModelChange)="cambiarRol($event)">
        <option value="CIUDADANO">Ciudadano</option>
        <option value="FUNCIONARIO">Gestión Municipal</option>
        <option value="INSPECTOR">Inspector (Campo)</option>
        <option value="ESPECIALISTA">Especialista (Cuadrilla)</option>
      </select>
    </div>
  </div>
</nav>
