<div class="dashboard-layout" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand" *ngIf="!sidebarCollapsed">
        <span class="mat-icon" style="font-size: 24px; color: var(--primary-300);">account_balance</span>
        <span class="sidebar-brand-text">Muni SJS</span>
      </div>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <span class="mat-icon">{{ sidebarCollapsed ? 'menu' : 'menu_open' }}</span>
      </button>
    </div>

    <!-- Rol Badge -->
    <div class="sidebar-role" *ngIf="currentConfig && !sidebarCollapsed">
      <span class="badge" [ngClass]="currentConfig.badgeClass">{{ currentConfig.titulo }}</span>
    </div>

    <!-- Navigation Items -->
    <nav class="sidebar-nav" *ngIf="currentConfig">
      <a *ngFor="let item of currentConfig.items"
         [routerLink]="item.route"
         routerLinkActive="nav-active"
         class="sidebar-nav-item"
         [title]="item.label">
        <span class="mat-icon nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Bottom Actions -->
    <div class="sidebar-bottom">
      <a routerLink="/" class="sidebar-nav-item" title="Volver al Portal">
        <span class="mat-icon nav-icon">home</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Portal</span>
      </a>
      <button class="sidebar-nav-item logout-btn" (click)="cerrarSesion()" title="Cerrar Sesión">
        <span class="mat-icon nav-icon">logout</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- ═══ Main Content ═══ -->
  <div class="main-wrapper">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="topbar-menu-btn" (click)="toggleSidebar()">
          <span class="mat-icon">menu</span>
        </button>
        <h2 class="topbar-title" *ngIf="currentConfig">{{ currentConfig.titulo }}</h2>
      </div>
      <div class="topbar-right">
        <span class="badge" [ngClass]="currentConfig!.badgeClass || 'badge-neutral'" *ngIf="currentConfig">
          {{ rolActual }}
        </span>
        <div class="topbar-avatar">
          <span class="mat-icon">person</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
