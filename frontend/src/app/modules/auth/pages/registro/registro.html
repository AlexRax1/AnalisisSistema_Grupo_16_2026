<div class="registro-page animate-fade-in">
  <h2 class="registro-title">Registro de Ciudadano</h2>
  <p class="registro-subtitle">Crea tu cuenta para reportar problemas en tu comunidad</p>

  <form [formGroup]="registroForm" (ngSubmit)="onRegister()" novalidate>
    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="dpi">DPI / Cédula <span class="required">*</span></label>
        <input type="text" id="dpi" class="form-input" formControlName="dpi"
               placeholder="13 dígitos del DPI" maxlength="13"
               [class.is-invalid]="esCampoInvalido('dpi')">
      </div>

      <div class="form-group">
        <label class="form-label" for="telefono">Teléfono <span class="required">*</span></label>
        <input type="text" id="telefono" class="form-input" formControlName="telefono"
               placeholder="8 dígitos" maxlength="8"
               [class.is-invalid]="esCampoInvalido('telefono')">
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="nombres">Nombres <span class="required">*</span></label>
        <input type="text" id="nombres" class="form-input" formControlName="nombres"
               placeholder="Ingrese sus nombres"
               [class.is-invalid]="esCampoInvalido('nombres')">
      </div>

      <div class="form-group">
        <label class="form-label" for="apellidos">Apellidos <span class="required">*</span></label>
        <input type="text" id="apellidos" class="form-input" formControlName="apellidos"
               placeholder="Ingrese sus apellidos"
               [class.is-invalid]="esCampoInvalido('apellidos')">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="direccion">Dirección de Residencia <span class="required">*</span></label>
      <input type="text" id="direccion" class="form-input" formControlName="direccion"
             placeholder="Ingrese su dirección completa"
             [class.is-invalid]="esCampoInvalido('direccion')">
    </div>

    <div class="form-group">
      <label class="form-label" for="correo">Correo Electrónico <span class="required">*</span></label>
      <input type="email" id="correo" class="form-input" formControlName="correo"
             placeholder="ejemplo@correo.com"
             [class.is-invalid]="esCampoInvalido('correo')">
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
        <input type="password" id="password" class="form-input" formControlName="password"
               placeholder="Mín. 6 caracteres"
               [class.is-invalid]="esCampoInvalido('password')">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirmar <span class="required">*</span></label>
        <input type="password" id="confirmPassword" class="form-input" formControlName="confirmPassword"
               placeholder="Repita la contraseña"
               [class.is-invalid]="esCampoInvalido('confirmPassword')">
      </div>
    </div>

    <div *ngIf="errorMsg" class="alert alert-error">
      <span class="mat-icon" style="font-size: 18px; flex-shrink: 0;">error</span>
      <span>{{ errorMsg }}</span>
    </div>
    <div *ngIf="successMsg" class="alert alert-success">
      <span class="mat-icon" style="font-size: 18px; flex-shrink: 0;">check_circle</span>
      <span>{{ successMsg }}</span>
    </div>

    <div class="registro-actions">
      <button type="button" (click)="onCancelar()" class="btn btn-outline">Cancelar</button>
      <button type="submit" class="btn btn-primary">
        <span class="mat-icon">person_add</span>
        Registrarse
      </button>
    </div>

    <p class="registro-login-link">
      ¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a>
    </p>
  </form>
</div>
