<div class="registro-container">
  <h2>Registro de Ciudadano</h2>

  <form [formGroup]="registroForm" (ngSubmit)="onRegister()" novalidate>
    <div class="form-group">
      <label for="dpi">DPI / Cédula *</label>
      <input type="text" id="dpi" formControlName="dpi" placeholder="Ingrese 13 dígitos del DPI"
             [class.is-invalid]="esCampoInvalido('dpi')">
    </div>

    <div class="form-group">
      <label for="nombres">Nombres *</label>
      <input type="text" id="nombres" formControlName="nombres" placeholder="Ingrese sus nombres"
             [class.is-invalid]="esCampoInvalido('nombres')">
    </div>

    <div class="form-group">
      <label for="apellidos">Apellidos *</label>
      <input type="text" id="apellidos" formControlName="apellidos" placeholder="Ingrese sus apellidos"
             [class.is-invalid]="esCampoInvalido('apellidos')">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono (8 dígitos) *</label>
      <input type="text" id="telefono" formControlName="telefono" placeholder="Ej: 12345678" maxlength="8"
             [class.is-invalid]="esCampoInvalido('telefono')">
    </div>

    <div class="form-group">
      <label for="direccion">Dirección de residencia *</label>
      <input type="text" id="direccion" formControlName="direccion" placeholder="Ingrese su dirección"
             [class.is-invalid]="esCampoInvalido('direccion')">
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico *</label>
      <input type="email" id="correo" formControlName="correo" placeholder="ejemplo@correo.com"
             [class.is-invalid]="esCampoInvalido('correo')">
    </div>

    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres, 1 mayúscula, 1 número y 1 especial"
             [class.is-invalid]="esCampoInvalido('password')">
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña *</label>
      <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Repita la contraseña"
             [class.is-invalid]="esCampoInvalido('confirmPassword')">
    </div>

    <p *ngIf="errorMsg" class="alert error-alert">{{ errorMsg }}</p>
    <p *ngIf="successMsg" class="alert success-alert">{{ successMsg }}</p>

    <div class="acciones-container">
      <button type="submit" class="btn-primary">Registrarse</button>
      <button type="button" (click)="onCancelar()" class="btn-secondary">Cancelar</button>
    </div>
  </form>
</div>
