<div style="max-width: 450px; margin: 30px auto; padding: 25px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; font-family: sans-serif;">
  <h2 style="text-align: center; color: #1e293b; margin-top: 0;">Registro Ciudadano (CU01)</h2>

  <form (ngSubmit)="onRegistro()">
    <div style="margin-bottom: 12px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">DPI / Cédula:</label>
      <input type="text" [(ngModel)]="nuevoUsuario.dpi" name="dpi" placeholder="13 dígitos" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 12px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre Completo:</label>
      <input type="text" [(ngModel)]="nuevoUsuario.nombreCompleto" name="nombreCompleto" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 12px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Electrónico:</label>
      <input type="email" [(ngModel)]="nuevoUsuario.correo" name="correo" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 12px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Teléfono de Contacto:</label>
      <input type="text" [(ngModel)]="nuevoUsuario.telefono" name="telefono" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña:</label>
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
    </div>

    <button type="submit" style="width: 100%; background: #059669; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
      Crear Cuenta
    </button>
  </form>

  <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
    ¿Ya tienes cuenta? <a routerLink="/auth/login" style="color: #2563eb; text-decoration: none; font-weight: bold;">Inicia sesión</a>
  </p>
</div>
