<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Mi Perfil</h4>
    </div>
    <div class="card-body">

      <div *ngIf="mensajeExito" class="alert alert-success alert-dismissible fade show">
        {{ mensajeExito }}
      </div>
      <div *ngIf="mensajeError" class="alert alert-danger alert-dismissible fade show">
        {{ mensajeError }}
      </div>

      <!-- Formulario (Se muestra cuando cargando == false) -->
      <form *ngIf="!cargando" [formGroup]="perfilForm" (ngSubmit)="guardarCambios()">
        <!-- Campos del formulario -->
      </form>

      <div *ngIf="cargando" class="text-center py-4">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Cargando datos del perfil...</p>
      </div>

      <form *ngIf="!cargando" [formGroup]="perfilForm" (ngSubmit)="guardarCambios()">

        <h5 class="text-secondary border-bottom pb-2">Información Personal</h5>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">DPI (Solo Lectura)</label>
            <input type="text" class="form-control" formControlName="dpi" readonly />
          </div>
          <div class="col-md-4">
            <label class="form-label">Nombres (Solo Lectura)</label>
            <input type="text" class="form-control" formControlName="nombres" readonly />
          </div>
          <div class="col-md-4">
            <label class="form-label">Apellidos (Solo Lectura)</label>
            <input type="text" class="form-control" formControlName="apellidos" readonly />
          </div>
        </div>

        <h5 class="text-secondary border-bottom pb-2 mt-4">Datos de Contacto</h5>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Teléfono *</label>
            <input type="text" class="form-control" formControlName="telefono" maxlength="8" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Correo Electrónico *</label>
            <input type="email" class="form-control" formControlName="correo" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Dirección de Residencia *</label>
            <input type="text" class="form-control" formControlName="direccion" />
          </div>
        </div>

        <h5 class="text-secondary border-bottom pb-2 mt-4">Cambiar Contraseña (Opcional)</h5>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Contraseña Actual</label>
            <input type="password" class="form-control" formControlName="passwordActual" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Nueva Contraseña</label>
            <input type="password" class="form-control" formControlName="nuevaPassword" />
            <small class="text-muted d-block mt-1">Mínimo 6 caracteres, 1 mayúscula, 1 número y 1 símbolo.</small>
          </div>
          <div class="col-md-4">
            <label class="form-label">Confirmar Nueva Contraseña</label>
            <input type="password" class="form-control" formControlName="confirmarNuevaPassword" />
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>

      </form>
    </div>
  </div>
</div>
