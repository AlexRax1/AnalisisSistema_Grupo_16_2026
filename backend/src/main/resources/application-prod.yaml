server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

jwt:
  expiration: ${JWT_EXPIRATION_MS:1800000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # El estado del contenedor no debe depender de que Gmail esté disponible.
    mail:
      enabled: false
